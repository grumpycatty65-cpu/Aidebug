apply plugin: 'com.android.application'

android {
    namespace "com.example.aichat"
    compileSdkVersion 33

    defaultConfig {
        applicationId "com.example.aichat"
        minSdkVersion 28   // Android 9.0
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Никаких сторонних библиотек — используем только встроенные
// HttpURLConnection и org.json, чтобы приложение оставалось лёгким.
dependencies {}
